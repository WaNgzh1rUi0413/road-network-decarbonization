[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "road-network-decarbonization"
version = "1.0.0"
description = "Reproducible experiments for road-network topology and urban mobility decarbonization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scipy==1.15.2",
  "scikit-learn==1.6.1", "joblib==1.4.2", "openpyxl==3.1.5",
  "networkx==3.6.1", "osmnx==2.1.0", "shapely==2.1.2",
  "xgboost==3.0.0", "lightgbm==4.6.0", "catboost==1.2.8",
  "shap==0.46.0", "tqdm==4.67.1", "coptpy==8.0.4",
]

[tool.setuptools.packages.find]
include = ["src*"]
